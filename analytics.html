<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
<!-- Metadata -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="DIVEORA analytics: revenue, customers, car performance, pick-up times and insights.">
<meta name="author" content="DIVEORA">
<meta name="keywords" content="car rental, DIVEORA, fleet, bookings, analytics, dashboard">
<meta name="theme-color" content="#5a1a2e">
<!-- Open Graph (social sharing) -->
<meta property="og:site_name" content="DIVEORA">
<meta property="og:type" content="website">
<meta property="og:title" content="Analytics | DIVEORA">
<meta property="og:description" content="DIVEORA analytics: revenue, customers, car performance, pick-up times and insights.">
<title>Analytics | DIVEORA</title>
<link rel="icon" href="images/logo.svg" type="image/svg+xml">
<!-- Bootstrap 5, Bootstrap Icons, Google Font -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<!-- Apply the saved theme before the page is drawn (no white flash in dark mode) -->
<script>try{document.documentElement.setAttribute("data-bs-theme",localStorage.getItem("de_theme")||"light")}catch(e){}</script>
</head>
<body data-page="analytics">
<div id="nav"></div>
<main class="container-xxl py-4" id="main">
  <div class="page-head"><div><h1 class="h3 mb-1">Analytics</h1><p class="text-muted mb-0" id="aNote"></p></div>
    <div class="d-flex gap-2 flex-wrap"><div class="btn-group period" id="period" role="group" aria-label="Time period"><button class="btn btn-outline-secondary" data-p="30">30 days</button><button class="btn btn-outline-secondary" data-p="90">90 days</button><button class="btn btn-outline-secondary active" data-p="year">This year</button></div>
    <button id="csvA" class="btn btn-gold"><i class="bi bi-download me-1"></i>Export CSV</button></div></div>
  <!-- KPI cards -->
  <section class="row g-3 mb-3" id="aKpis" aria-label="Key figures"></section>
  <!-- Auto-generated insights -->
  <section class="card p-3 mb-3"><div class="card-h">Key insights</div><div class="card-s">Generated automatically from the selected period</div><div class="row g-3" id="insights"></div></section>
  <!-- 14 charts (built by js/pages.js) -->
  <section class="row g-3 mb-3" id="chartGrid" aria-label="Charts"></section>
  <!-- Ranking tables -->
  <section class="row g-3">
    <div class="col-12 col-xl-7"><div class="card p-3 h-100"><div class="card-h">Model ranking</div><div class="card-s">Sorted by revenue</div>
      <div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>#</th><th>Model</th><th>Type</th><th>Bookings</th><th>Days</th><th>Revenue</th><th>Avg</th></tr></thead><tbody id="tbModels"></tbody></table></div></div></div>
    <div class="col-12 col-xl-5"><div class="card p-3 h-100"><div class="card-h">Top customers</div><div class="card-s">Top 10 by spending</div>
      <div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>#</th><th>Customer</th><th>Bookings</th><th>Days</th><th>Spent</th><th>Last pick-up</th></tr></thead><tbody id="tbCust"></tbody></table></div></div></div>
  </section>
</main>
<div id="foot"></div>
<!-- Scripts: Bootstrap, Chart.js, then app code -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/pages.js"></script>
</body>
</html>
