<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
<!-- Metadata -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Read DIVEORA articles on car rental tips, vehicle maintenance, safe driving, travel guides and company updates.">
<meta name="author" content="DIVEORA">
<meta name="keywords" content="car rental, DIVEORA, articles, car maintenance, safe driving, road trip">
<meta name="theme-color" content="#5a1a2e">
<!-- Open Graph (social sharing) -->
<meta property="og:site_name" content="DIVEORA">
<meta property="og:type" content="website">
<meta property="og:title" content="Articles | DIVEORA">
<meta property="og:description" content="Read DIVEORA articles on car rental tips, vehicle maintenance, safe driving, travel guides and company updates.">
<title>Articles | DIVEORA</title>
<link rel="icon" href="images/logo.svg" type="image/svg+xml">
<!-- Bootstrap 5, Bootstrap Icons, Google Font -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<!-- Apply the saved theme before the page is drawn (no white flash in dark mode) -->
<script>try{document.documentElement.setAttribute("data-bs-theme",localStorage.getItem("de_theme")||"light")}catch(e){}</script>
</head>
<body data-page="articles">
<div id="nav"></div>
<main class="container-xxl py-4" id="main">
  <div class="page-head"><div><h1 class="h3 mb-1">Articles</h1><p class="text-muted mb-0" id="count"></p></div></div>
  <!-- Search, category filter and reset -->
  <section class="card p-3 mb-3" aria-label="Search and filter articles"><div class="row g-2">
    <div class="col-12 col-md-7"><input id="q" class="form-control" placeholder="Search articles" aria-label="Search articles"></div>
    <div class="col-10 col-md-4"><select id="fCat" class="form-select" aria-label="Filter by category"></select></div>
    <div class="col-2 col-md-1"><button id="reset" class="btn btn-outline-secondary w-100" title="Reset" aria-label="Reset search and filter"><i class="bi bi-arrow-counterclockwise"></i></button></div></div></section>
  <!-- Article cards (filled by js/articles.js) -->
  <section class="row g-3" id="artGrid" aria-label="Article list"></section>
</main>
<!-- Full article popup (opened by Read more) -->
<div class="modal fade" id="artModal" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-dialog-centered modal-lg modal-dialog-scrollable"><div class="modal-content">
  <div class="modal-header"><h5 class="modal-title" id="aTitle"></h5><button class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
  <div class="modal-body"><div id="aImg" class="mb-3"></div><div id="aMeta" class="mb-3"></div><div id="aBody"></div></div>
  <div class="modal-footer"><button class="btn btn-gold" data-bs-dismiss="modal">Close</button></div></div></div></div>
<div id="foot"></div>
<!-- Scripts: Bootstrap, then app code -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/articles.js"></script>
</body>
</html>
