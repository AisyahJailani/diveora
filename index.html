<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
<!-- Metadata -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Sign in to DIVEORA, the car rental management dashboard.">
<meta name="author" content="DIVEORA">
<meta name="keywords" content="car rental, DIVEORA, fleet, bookings, analytics, dashboard">
<meta name="theme-color" content="#5a1a2e">
<!-- Open Graph (social sharing) -->
<meta property="og:site_name" content="DIVEORA">
<meta property="og:type" content="website">
<meta property="og:title" content="Login | DIVEORA">
<meta property="og:description" content="Sign in to DIVEORA, the car rental management dashboard.">
<title>Login | DIVEORA</title>
<link rel="icon" href="images/logo.svg" type="image/svg+xml">
<!-- Bootstrap 5, Bootstrap Icons, Google Font -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<!-- Apply the saved theme before the page is drawn (no white flash in dark mode) -->
<script>try{document.documentElement.setAttribute("data-bs-theme",localStorage.getItem("de_theme")||"light")}catch(e){}</script>
</head>
<body data-page="login">
<main class="login-page" id="main">
  <!-- Login card: brand panel on the left, sign-in form on the right -->
  <div class="login-card">
    <!-- Left: brand, headline and short description -->
    <section class="login-hero">
      <img src="images/hero.svg" class="login-mark" alt="" aria-hidden="true">
      <div class="login-brand"><img src="images/logo.svg" width="68" height="68" alt="DIVEORA logo"><span>DIVEORA</span></div>
      <div class="login-copy">
        <h1>Manage your rental fleet with confidence.</h1>
        <p>A car rental management system for tracking vehicles, customers, bookings and revenue from a single dashboard.</p>
      </div>
    </section>
    <!-- Right: login form (username and password are pre-filled) -->
    <section class="login-form">
      <!-- Light / dark mode button: top-left corner of the sign-in box -->
      <button class="theme-float" id="themeBtn" aria-label="Switch light or dark mode"><i class="themeIcon bi"></i></button>
      <div class="login-inner">
        <div class="login-small-brand"><img src="images/logo.svg" width="26" height="26" alt=""><span>DIVEORA</span></div>
        <h2>Welcome Back, Admin</h2>
        <p class="text-muted mb-4">Sign in to continue to your dashboard.</p>
        <div id="err" class="alert alert-danger d-none" role="alert"><i class="bi bi-exclamation-triangle-fill me-2"></i>Invalid username or password. Check both and try again.</div>
        <form id="loginForm" novalidate>
          <label class="form-label" for="user">Username</label>
          <div class="input-group mb-3"><span class="input-group-text"><i class="bi bi-person"></i></span><input id="user" class="form-control" autocomplete="username" value="aisyah" required autofocus></div>
          <label class="form-label" for="pass">Password</label>
          <div class="input-group mb-4"><span class="input-group-text"><i class="bi bi-lock"></i></span><input id="pass" type="password" class="form-control" autocomplete="current-password" value="Ims@566" required><button type="button" id="togglePass" class="btn btn-outline-secondary" aria-label="Show password"><i class="bi bi-eye"></i></button></div>
          <button class="btn btn-brand w-100 login-btn" type="submit">Sign in<i class="bi bi-arrow-right ms-2"></i></button>
        </form>
      </div>
    </section>
  </div>
</main>
<!-- Scripts: Bootstrap, Chart.js, then app code -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/pages.js"></script>
</body>
</html>
