<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 640" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Car silhouette driving along a road">
  <style>
    .drive{animation:drive 15s linear infinite;animation-delay:-5s}
    .wheel{transform-box:fill-box;transform-origin:center;animation:spin 1.5s linear infinite}
    @keyframes drive{from{transform:translateX(-250px)}to{transform:translateX(790px)}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media (prefers-reduced-motion:reduce){.drive,.wheel{animation:none}.drive{transform:translateX(150px)}}
  </style>
  <defs>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c9973f" stop-opacity=".35"/><stop offset="1" stop-color="#c9973f" stop-opacity="0"/></linearGradient>
  </defs>
  <!-- Faint city skyline -->
  <g fill="#ffffff" fill-opacity=".05">
    <rect x="24" y="236" width="44" height="80"/><rect x="76" y="196" width="52" height="120"/><rect x="136" y="256" width="38" height="60"/>
    <rect x="318" y="214" width="46" height="102"/><rect x="372" y="176" width="58" height="140"/><rect x="438" y="246" width="50" height="70"/>
  </g>
  <!-- Road -->
  <path d="M0 316H520" stroke="#ffffff" stroke-opacity=".28" stroke-width="1.5"/>
  <path d="M0 334H520" stroke="#ffffff" stroke-opacity=".14" stroke-width="1.5" stroke-dasharray="22 16"/>
  <!-- Car (silhouette facing right) -->
  <g class="drive"><g transform="translate(0 226) scale(.8)">
    <ellipse cx="150" cy="114" rx="138" ry="3.6" fill="#000" fill-opacity=".28"/>
    <path d="M290 80L520 44V118L290 90Z" fill="url(#beam)"/>
    <path d="M10 96V82Q10 74 20 72L56 66Q66 64 74 56L98 34Q104 29 112 29H176Q188 29 196 36L222 60Q226 63 232 64L262 68Q282 71 288 82L290 96Z" fill="#ffffff" fill-opacity=".24" stroke="#ffffff" stroke-opacity=".4" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M82 57L102 38Q105 35.5 110 35.5H141V57ZM149 35.5H175Q181 35.5 186 39.5L205 57H149Z" fill="#33101c" fill-opacity=".85"/>
    <path d="M12 86H286" stroke="#ffffff" stroke-opacity=".25" stroke-width="1"/>
    <rect x="280" y="76" width="9" height="5" rx="2" fill="#c9973f"/>
    <rect x="9" y="76" width="6" height="5" rx="2" fill="#ffffff" fill-opacity=".5"/>
    <circle cx="62" cy="96" r="20" fill="#33101c" stroke="#ffffff" stroke-opacity=".4" stroke-width="1.5"/>
    <g class="wheel"><circle cx="62" cy="96" r="12" fill="none" stroke="#ffffff" stroke-opacity=".5" stroke-width="1.5"/><path d="M62 85V107M51 96H73M54 88L70 104M70 88L54 104" stroke="#ffffff" stroke-opacity=".5" stroke-width="2" stroke-linecap="round"/></g>
    <circle cx="232" cy="96" r="20" fill="#33101c" stroke="#ffffff" stroke-opacity=".4" stroke-width="1.5"/>
    <g class="wheel"><circle cx="232" cy="96" r="12" fill="none" stroke="#ffffff" stroke-opacity=".5" stroke-width="1.5"/><path d="M232 85V107M221 96H243M224 88L240 104M240 88L224 104" stroke="#ffffff" stroke-opacity=".5" stroke-width="2" stroke-linecap="round"/></g>
  </g></g>
</svg>
